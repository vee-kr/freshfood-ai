<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scan Food</title>

    <link href="css/style.css" rel="stylesheet"/>

    <script src="js/script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500&display=swap" rel="stylesheet">

</head>
<body>
<header>
    <img src="images/logo.png">
    <h1>Scan Food</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="scan.html">Scan Food</a>
        <a href="my-food.html">My Food</a>
    </nav>
</header>

<main>
    <section class="scan-section">
        <p class="scan-instruction">
            Point your camera at the food and take a photo to check its expiration date.
        </p>

        <div class="upload-area">
            <label for="food-photo" class="primary-button">
                Take Photo
            </label>

            <input
                id="food-photo"
                type="file"
                accept="image/*"
                capture="environment"
            >
        </div>

        <img
            alt="Preview of the selected product"
            id="preview-food"
        >

        <div class="scan-button-container">
            <button
                type="button"
                id="scan-button"
                class="primary-button"
                disabled
                aria-live="polite"
            >
                Scan Food
            </button>
        </div>

        <p id="scan-message" aria-live="polite"></p>
    </section>
</main>

</body>
</html>
